<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>CollectorRack</title>

    <!-- Icono para la pantalla de inicio del iPhone y nombre bajo el icono -->
    <link rel="icon" href="apple-touch-icon.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="CollectorRack">
    <meta name="theme-color" content="#0A0A0B">

    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <!-- ===================== CABECERA ===================== -->
    <header class="cabecera">
        <svg class="logo" viewBox="0 0 421 418" aria-hidden="true">
            <g transform="matrix(1.07738,0,0,1.08441,-36.651282,-27.345931)">
                <circle cx="229.4" cy="217.949" r="150.655" fill="#E01E1B"/>
            </g>
            <g transform="matrix(1.07738,0,0,1.08441,-36.65132,-27.345931)">
                <path d="M78.745,217.949L143.064,217.949C143.064,265.631 181.718,304.286 229.4,304.286L229.4,368.604C146.196,368.604 78.745,301.154 78.745,217.949Z" fill="#0A0A0B"/>
            </g>
            <g transform="matrix(1.214388,0,0,1.214388,-87.87597,-48.000584)">
                <path d="M166.644,211.63L245.701,211.63L245.701,290.686C202.039,290.686 166.644,255.291 166.644,211.63Z" fill="#fff"/>
            </g>
        </svg>
        <h1 translate="no">Collector</h1>
        <p class="contador"><strong id="total">0</strong> <span id="total-texto">álbumes en la colección</span></p>
    </header>

    <main>

        <!-- ===================== HERRAMIENTAS: añadir y ordenar ===================== -->
        <div class="herramientas">
            <button type="button" class="boton boton-primario" id="btn-anadir">+ Añadir álbum</button>

            <div class="orden">
                <label for="orden">Ordenar por</label>
                <select id="orden">
                    <option value="fecha">Fecha de incorporación</option>
                    <option value="alfabetico">A-Z (título)</option>
                    <option value="puntuacion">Puntuación</option>
                    <option value="genero">Género</option>
                </select>
                <!-- Solo se ve al ordenar por fecha: alterna entre recientes y antiguos primero -->
                <button type="button" class="boton boton-secundario" id="btn-sentido" hidden></button>
            </div>
        </div>

        <!-- Mensaje cuando la colección está vacía -->
        <p class="vacio" id="vacio" hidden>Tu estantería está vacía. Pulsa «Añadir álbum» para colocar tu primer CD.</p>

        <!-- ===================== ESTANTERÍA (la rellena js/estanteria.js) ===================== -->
        <section class="estanteria" id="estanteria" aria-label="Estantería de CDs"></section>
        <p class="ayuda">Toca un CD para sacarlo de la estantería.</p>

        <!-- ===================== COPIA DE SEGURIDAD ===================== -->
        <section class="copia" aria-labelledby="titulo-copia">
            <h2 id="titulo-copia">Copia de seguridad</h2>
            <p>Tus álbumes se guardan solo en este navegador. Descarga una copia de vez en cuando para no perderlos.</p>
            <div class="copia-botones">
                <button type="button" class="boton boton-secundario" id="btn-exportar-json">Descargar copia (.json)</button>
                <button type="button" class="boton boton-secundario" id="btn-exportar-txt">Descargar lista (.txt)</button>
                <button type="button" class="boton boton-secundario" id="btn-importar">Importar archivo…</button>
                <button type="button" class="boton boton-secundario" id="btn-vaciar">Vaciar colección</button>
                <input type="file" id="archivo" accept=".json,.txt,application/json,text/plain" hidden>
            </div>
        </section>
    </main>

    <!-- ===================== VENTANA: ficha del álbum (CD de frente) ===================== -->
    <dialog class="visor" id="visor" aria-labelledby="visor-titulo">
        <div class="visor-fondo" id="visor-fondo"></div>
        <div class="visor-escena">
            <div class="cd-frente" id="cd-frente" aria-hidden="true">
                <span class="etiqueta-num" id="v-num"></span>
                <div class="disco"></div>
                <div class="pegatina">
                    <span id="v-pegatina-titulo"></span>
                    <span id="v-pegatina-artista"></span>
                    <span id="v-pegatina-nota"></span>
                </div>
            </div>

            <div class="ficha" id="ficha">
                <h2 id="visor-titulo"></h2>
                <p class="ficha-artista" id="v-artista"></p>

                <ul class="ficha-datos">
                    <li class="etiqueta" id="v-genero" hidden></li>
                    <li id="v-lanzamiento" hidden></li>
                    <li id="v-anadido" hidden></li>
                </ul>

                <div class="ficha-nota">
                    <div class="nota-barra" id="v-barra" role="img"><span id="v-barra-relleno"></span></div>
                    <strong id="v-nota"></strong>
                </div>

                <blockquote id="v-comentario" hidden></blockquote>

                <div class="ficha-acciones">
                    <button type="button" class="boton boton-suave" id="v-editar">Editar</button>
                    <button type="button" class="boton boton-peligro" id="v-eliminar">Eliminar</button>
                    <button type="button" class="boton boton-secundario" id="v-cerrar">Volver a la estantería</button>
                </div>
            </div>
        </div>
    </dialog>

    <!-- ===================== VENTANA: añadir / editar álbum ===================== -->
    <dialog class="modal" id="editor" aria-labelledby="editor-titulo">
        <form id="form-album">
            <h2 id="editor-titulo">Añadir álbum</h2>

            <div class="campos">
                <div class="campo campo-ancho">
                    <label for="f-titulo">Título del álbum</label>
                    <input type="text" id="f-titulo" name="titulo" required maxlength="200" autocomplete="off" placeholder="Ej. Blonde…">
                </div>
                <div class="campo campo-ancho">
                    <label for="f-artista">Artista</label>
                    <input type="text" id="f-artista" name="artista" required maxlength="200" autocomplete="off" placeholder="Ej. Frank Ocean…">
                </div>
                <div class="campo">
                    <label for="f-genero">Género</label>
                    <input type="text" id="f-genero" name="genero" list="generos" maxlength="60" autocomplete="off" placeholder="Ej. R&amp;B / Soul…">
                    <datalist id="generos"></datalist>
                </div>
                <div class="campo">
                    <label for="f-nota">Nota (0 a 10)</label>
                    <input type="text" id="f-nota" name="nota" required inputmode="decimal" maxlength="4" autocomplete="off" pattern="(10([.,]0)?|\d([.,]\d)?)" title="Un número de 0 a 10, con coma o punto para el decimal (8,5)" placeholder="Ej. 8,5…">
                </div>
                <div class="campo campo-ancho">
                    <label for="f-lanzamiento">Fecha de lanzamiento (opcional)</label>
                    <input type="text" id="f-lanzamiento" name="lanzamiento" maxlength="10" autocomplete="off"
                           pattern="\d{4}(-(0[1-9]|1[0-2])(-(0[1-9]|[12]\d|3[01]))?)?"
                           title="Año (2016), año y mes (2016-08) o fecha completa (2016-08-20)"
                           placeholder="AAAA, AAAA-MM o AAAA-MM-DD…">
                </div>
                <div class="campo campo-ancho">
                    <label for="f-comentario">Comentario o canción favorita</label>
                    <textarea id="f-comentario" name="comentario" rows="4" maxlength="2000" autocomplete="off" placeholder="Tu reseña personal…"></textarea>
                </div>
            </div>

            <div class="acciones">
                <button type="button" class="boton boton-secundario" id="f-cancelar">Cancelar</button>
                <button type="submit" class="boton boton-primario" id="f-guardar">Guardar álbum</button>
            </div>
        </form>
    </dialog>

    <!-- ===================== VENTANA: confirmaciones (la rellena js/ui.js) ===================== -->
    <dialog class="modal modal-pequeno" id="confirmacion" aria-labelledby="confirmacion-titulo" aria-describedby="confirmacion-texto">
        <h2 id="confirmacion-titulo"></h2>
        <p id="confirmacion-texto"></p>
        <div class="acciones" id="confirmacion-botones"></div>
    </dialog>

    <!-- Avisos breves ("Guardado", "Álbum eliminado"…). aria-live los anuncia a lectores de pantalla -->
    <div class="aviso" id="aviso" popover="manual" role="status" aria-live="polite"></div>

    <!-- ===================== SCRIPTS (el orden importa: cada uno usa los anteriores) ===================== -->
    <script src="util.js"></script>
    <script src="ui.js"></script>
    <script src="datos.js"></script>
    <script src="estanteria.js"></script>
    <script src="ficha.js"></script>
    <script src="formulario.js"></script>
    <script src="copia.js"></script>
    <script src="app.js"></script>
</body>
</html>
