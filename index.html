<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CollectorRack</title>
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="CollectorRack">
    <meta name="theme-color" content="#0A0A0B">
    <style>
/* ==========================================================================
   COLLECTOR · estilos
   Paleta y tipografía tomadas del diseño original (files.zip):
   negro #0A0A0B · carbón #121212 · borde #221F22 · hueso #F7F4F0
   gris #8E8E93 · rojo #E01E1B  ·  tipografía: Arial, Helvetica, sans-serif
   ========================================================================== */

:root {
    --negro: #0A0A0B;
    --carbon: #121212;
    --carbon-2: #1c1c1c;
    --borde: #221F22;
    --hueso: #F7F4F0;
    --gris: #8E8E93;
    --gris-claro: #b8b8be;
    --rojo: #E01E1B;
    --rojo-oscuro: #b51715;

    --alto-hueco: 26px;      /* alto de cada CD visto de canto */
    --sep-hueco: 3px;
}

* { box-sizing: border-box; }

[hidden] { display: none !important; }

html { scrollbar-gutter: stable; }

body {
    background-color: var(--negro);
    color: var(--hueso);
    font-family: Arial, Helvetica, sans-serif;
    margin: 0;
    padding: 28px 20px 60px;
}

body.visor-abierto { overflow: hidden; }

/* ---------- Cabecera ---------- */
.cabecera {
    max-width: 1100px;
    margin: 0 auto 28px;
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo { width: 34px; height: 34px; flex: none; }

.cabecera h1 {
    margin: 0;
    font-size: 1.6rem;
    font-weight: 700;
}

.contador {
    margin: 0 0 0 auto;
    color: var(--gris);
    font-size: 0.95rem;
}

.contador strong { color: var(--hueso); }

main { max-width: 1100px; margin: 0 auto; }

/* ---------- Formulario ---------- */
.formulario {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 10px;
    margin-bottom: 36px;
}

.formulario input {
    background-color: var(--carbon);
    border: 1px solid var(--borde);
    color: var(--hueso);
    padding: 12px 14px;
    border-radius: 8px;
    font: inherit;
    font-size: 0.95rem;
    min-width: 0;
}

.formulario input::placeholder { color: var(--gris); }

.formulario input:focus {
    outline: none;
    border-color: var(--rojo);
}

.formulario button,
.visor button {
    font: inherit;
    font-weight: 700;
    font-size: 0.95rem;
    border-radius: 8px;
    cursor: pointer;
    transition: background-color 0.2s ease, border-color 0.2s ease;
}

.formulario button {
    background-color: var(--rojo);
    color: #fff;
    border: 1px solid var(--rojo);
    padding: 12px 20px;
}

.formulario button:hover { background-color: var(--rojo-oscuro); border-color: var(--rojo-oscuro); }

button:focus-visible,
input:focus-visible {
    outline: 2px solid var(--rojo);
    outline-offset: 2px;
}

/* ==========================================================================
   ESTANTERÍA
   .mueble  = un mueble de 4 columnas
   .columna = una pila vertical de huecos
   .hueco   = ranura donde entra un CD (vacía o con .cd dentro)
   ========================================================================== */
.estanteria {
    display: flex;
    flex-direction: column;
    gap: 28px;
}

.mueble {
    list-style: none;
    margin: 0;
    padding: 14px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    background: linear-gradient(180deg, #1c1c1c, #121212);
    border: 1px solid var(--borde);
    border-radius: 6px;
    box-shadow:
        inset 0 1px 0 rgba(247, 244, 240, 0.07),
        0 30px 50px -20px rgba(0, 0, 0, 0.9);
}

.columna {
    list-style: none;
    margin: 0;
    padding: 6px 5px 3px;
    background: #070708;
    border-radius: 3px;
    box-shadow: inset 0 3px 8px rgba(0, 0, 0, 0.9), inset 0 0 0 1px #151516;
}

.hueco {
    height: var(--alto-hueco);
    margin-bottom: var(--sep-hueco);
    border-radius: 2px;
    /* ranura vacía: una canaleta oscura como en el mueble real */
    background: linear-gradient(180deg, #0d0d0e, #161617);
    box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.8), 0 1px 0 #1c1c1c;
    position: relative;
}

/* ---------- CD visto de canto (lomo) ---------- */
.cd {
    position: absolute;
    inset: 0;
    width: 100%;
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0;
    padding: 0 10px 0 15px;
    border: 0;
    border-radius: 2px;
    font: inherit;
    font-size: 0.72rem;
    line-height: 1;
    text-align: left;
    cursor: pointer;
    overflow: hidden;
    color: var(--cd-texto);
    background: var(--cd-fondo);
    box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.28),
        0 1px 3px rgba(0, 0, 0, 0.7);
    transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
}

/* tapa lateral del estuche */
.cd::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 6px;
    background: var(--cd-tapa);
}

.cd-titulo {
    font-weight: 700;
    flex: 0 1 auto;
    max-width: 62%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.cd-artista {
    flex: 1 1 0;
    min-width: 0;
    color: var(--cd-secundario);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.cd-nota {
    flex: none;
    font-weight: 700;
    color: var(--cd-secundario);
}

/* Tres acabados de estuche (los elige Java según el título) */
.estilo-hielo {
    --cd-fondo: linear-gradient(180deg, rgba(247, 244, 240, 0.92), rgba(184, 184, 190, 0.86));
    --cd-texto: #121212;
    --cd-secundario: #3b3b40;
    --cd-tapa: rgba(142, 142, 147, 0.75);
}

.estilo-humo {
    --cd-fondo: linear-gradient(180deg, #3d3d42, #27272b);
    --cd-texto: var(--hueso);
    --cd-secundario: var(--gris-claro);
    --cd-tapa: #121212;
}

.estilo-rojo {
    --cd-fondo: linear-gradient(180deg, #c81a17, #a91513);
    --cd-texto: var(--hueso);
    --cd-secundario: #f1d4d2;
    --cd-tapa: #6e0d0c;
}

/* Al pasar el ratón el CD se adelanta un poco, como si lo empujases hacia fuera */
.cd:hover {
    transform: translateY(-1px) scale(1.035);
    filter: brightness(1.08);
    z-index: 2;
    box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.35),
        0 8px 14px rgba(0, 0, 0, 0.8);
}

.cd:focus-visible { outline: 2px solid var(--rojo); outline-offset: 2px; z-index: 3; }

/* CD que está sacado: su hueco se queda vacío */
.cd.fuera { visibility: hidden; }

/* CD recién añadido: entra en la ranura desde el frente */
.cd.nuevo { animation: entrar 0.8s cubic-bezier(0.2, 0.9, 0.3, 1.15); }

@keyframes entrar {
    0%   { transform: translateY(-46px) scale(1.3); opacity: 0;
           box-shadow: 0 24px 30px rgba(0, 0, 0, 0.8); }
    55%  { opacity: 1; box-shadow: 0 0 0 2px var(--rojo), 0 10px 16px rgba(0, 0, 0, 0.7); }
    100% { transform: none; opacity: 1; }
}

.ayuda {
    margin: 16px 0 0;
    color: var(--gris);
    font-size: 0.9rem;
}

/* ==========================================================================
   VISOR: CD de frente + información
   ========================================================================== */
.visor {
    position: fixed;
    inset: 0;
    z-index: 50;
}

.visor-fondo {
    position: absolute;
    inset: 0;
    background: rgba(10, 10, 11, 0.88);
    backdrop-filter: blur(10px);
}

.visor-escena {
    position: relative;
    height: 100%;
    padding: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(28px, 6vw, 80px);
    pointer-events: none;      /* el clic en el fondo cierra; lo interactivo lo reactivamos abajo */
}

.visor-escena > * { pointer-events: auto; }

/* ---------- Caja esmerilada con el disco, como la del archivo de referencia ---------- */
.cd-frente {
    --tinte: rgba(247, 244, 240, 0.3);
    position: relative;
    flex: none;
    width: clamp(230px, min(54vh, 44vw), 470px);
    aspect-ratio: 1 / 1;
    border-radius: 5%;
    background:
        linear-gradient(135deg, var(--tinte), rgba(142, 142, 147, 0.12)),
        #17171a;
    border: 1px solid rgba(247, 244, 240, 0.28);
    box-shadow:
        inset 0 2px 0 rgba(255, 255, 255, 0.2),
        inset 0 0 0 1px rgba(255, 255, 255, 0.05),
        0 40px 70px rgba(0, 0, 0, 0.7);
    transform-origin: center;
}

.cd-frente.estilo-humo { --tinte: rgba(70, 70, 78, 0.6); }
.cd-frente.estilo-rojo { --tinte: rgba(224, 30, 27, 0.4); }

/* relieve vertical de la caja (a la derecha) */
.cd-frente::after {
    content: "";
    position: absolute;
    right: 3.5%; top: 36%;
    width: 2px; height: 26%;
    border-radius: 2px;
    background: rgba(255, 255, 255, 0.25);
}

.disco {
    position: absolute;
    inset: 6%;
    border-radius: 50%;
    background:
        radial-gradient(circle closest-side,
            transparent 0 22%,
            rgba(142, 142, 147, 0.55) 22.5% 40%,
            transparent 40.5%),
        conic-gradient(from 200deg,
            #d9d9dd, #f7f4f0 12%, #9a9aa0 25%, #f7f4f0 38%,
            #c5c5cb 52%, #8e8e93 64%, #f7f4f0 78%, #d9d9dd);
    box-shadow: inset 0 0 0 3px rgba(142, 142, 147, 0.7);
    /* agujero central */
    -webkit-mask: radial-gradient(circle closest-side, transparent 0 20%, #000 20.5%);
            mask: radial-gradient(circle closest-side, transparent 0 20%, #000 20.5%);
}

.etiqueta-num {
    position: absolute;
    top: 5%; left: 6%;
    background: rgba(247, 244, 240, 0.88);
    color: var(--carbon);
    font-size: 0.75rem;
    padding: 3px 8px;
    border-radius: 3px;
}

.pegatina {
    position: absolute;
    right: 4%; bottom: 5%;
    max-width: 36%;
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 6px 8px;
    background: var(--hueso);
    color: var(--carbon);
    font-size: clamp(0.6rem, 1.3vw, 0.74rem);
    line-height: 1.3;
    border-radius: 2px;
}

.pegatina span {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.pegatina span:first-child { font-weight: 700; }

/* ---------- Ficha con la información ---------- */
.ficha {
    max-width: 420px;
    min-width: 0;
}

.ficha h2 {
    margin: 0;
    font-size: clamp(1.7rem, 3.4vw, 2.7rem);
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: -0.02em;
    overflow-wrap: anywhere;
}

.ficha-artista {
    margin: 10px 0 0;
    color: var(--gris);
    font-size: 1.15rem;
}

.ficha-nota {
    margin: 26px 0 18px;
    display: flex;
    align-items: baseline;
    gap: 14px;
}

.puntos {
    color: var(--rojo);
    letter-spacing: 3px;
    font-size: 0.95rem;
}

#v-nota { font-weight: 700; }

.ficha blockquote {
    margin: 0 0 30px;
    padding-left: 16px;
    border-left: 2px solid var(--rojo);
    color: var(--gris-claro);
    font-size: 1.05rem;
    line-height: 1.55;
    max-width: 60ch;
    overflow-wrap: anywhere;
}

#cerrar {
    background-color: rgba(224, 30, 27, 0.1);
    color: var(--hueso);
    border: 1px solid rgba(224, 30, 27, 0.5);
    padding: 11px 18px;
}

#cerrar:hover { background-color: rgba(224, 30, 27, 0.25); }

/* ==========================================================================
   RESPONSIVE
   ========================================================================== */
@media (max-width: 760px) {
    body { padding: 20px 14px 50px; }

    /* en móvil la estantería pasa a 2 columnas por mueble */
    .mueble { grid-template-columns: repeat(2, 1fr); padding: 10px; gap: 8px; }

    .visor-escena {
        flex-direction: column;
        justify-content: flex-start;
        gap: 24px;
        overflow-y: auto;
        padding: 28px 20px;
    }

    .cd-frente { width: min(72vw, 320px); }
    .ficha { max-width: 100%; width: 100%; }
}

@media (prefers-reduced-motion: reduce) {
    .cd, .cd.nuevo { transition: none; animation: none; }
}


/* ---------- Extras de la versión sin servidor ---------- */
.utiles { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.utiles .ayuda { margin: 0 auto 0 0; }
.utiles button {
    font: inherit; font-size: 0.85rem; font-weight: 700; cursor: pointer;
    background: transparent; color: var(--gris-claro);
    border: 1px solid var(--borde); border-radius: 8px; padding: 8px 14px;
}
.utiles button:hover { border-color: var(--gris); color: var(--hueso); }
    </style>
</head>
<body>

    <header class="cabecera">
        <svg class="logo" viewBox="0 0 421 418" aria-hidden="true">
            <g transform="matrix(1.07738,0,0,1.08441,-36.651282,-27.345931)">
                <circle cx="229.4" cy="217.949" r="150.655" fill="#E01E1B"/>
            </g>
            <g transform="matrix(1.07738,0,0,1.08441,-36.65132,-27.345931)">
                <path d="M78.745,217.949L143.064,217.949C143.064,265.631 181.718,304.286 229.4,304.286L229.4,368.604C146.196,368.604 78.745,301.154 78.745,217.949Z" fill="#0A0A0B"/>
            </g>
            <g transform="matrix(1.214388,0,0,1.214388,-87.87597,-48.000584)">
                <path d="M166.644,211.63L245.701,211.63L245.701,290.686C202.039,290.686 166.644,255.291 166.644,211.63Z" fill="#fff"/>
            </g>
        </svg>
        <h1>Collector</h1>
        <p class="contador"><strong id="total">0</strong> álbumes en la colección</p>
    </header>

    <main>
        <form class="formulario" id="formulario">
            <input type="text" name="titulo" placeholder="Título del álbum" aria-label="Título del álbum" required>
            <input type="text" name="artista" placeholder="Artista" aria-label="Artista" required>
            <input type="number" name="puntuacion" min="1" max="10" placeholder="Nota (1-10)" aria-label="Nota de 1 a 10" required>
            <input type="text" name="comentario" placeholder="Comentario o canción favorita" aria-label="Comentario o canción favorita" required>
            <button type="submit">Guardar álbum</button>
        </form>

        <section class="estanteria" id="estanteria" aria-label="Estantería de CDs"></section>

        <div class="utiles">
            <p class="ayuda">Toca un CD para sacarlo de la estantería.</p>
            <button type="button" id="exportar">Exportar albums.txt</button>
            <button type="button" id="importar">Importar albums.txt</button>
            <button type="button" id="vaciar">Vaciar colección</button>
            <input type="file" id="archivo" accept=".txt,text/plain" hidden>
        </div>
    </main>

    <div class="visor" id="visor" hidden role="dialog" aria-modal="true" aria-labelledby="visor-titulo">
        <div class="visor-fondo" id="visor-fondo"></div>
        <div class="visor-escena">
            <div class="cd-frente" id="cd-frente">
                <span class="etiqueta-num" id="v-num"></span>
                <div class="disco"></div>
                <div class="pegatina">
                    <span id="v-pegatina-titulo"></span>
                    <span id="v-pegatina-artista"></span>
                    <span id="v-pegatina-nota"></span>
                </div>
            </div>
            <div class="ficha" id="ficha">
                <h2 id="visor-titulo"></h2>
                <p class="ficha-artista" id="v-artista"></p>
                <p class="ficha-nota"><span class="puntos" id="v-puntos" aria-hidden="true"></span><span id="v-nota"></span></p>
                <blockquote id="v-comentario"></blockquote>
                <button type="button" id="cerrar">Volver a la estantería</button>
            </div>
        </div>
    </div>

    <script>
    (function () {
        // ======================= DATOS =======================
        // Álbumes iniciales (los de tu albums.txt). Solo se usan la primera vez;
        // después manda lo que haya guardado en el navegador.
        var INICIALES = [];
        var CLAVE = 'collector-albums';
        var COLUMNAS = 4, HUECOS_POR_COLUMNA = 10, HUECOS_POR_MUEBLE = COLUMNAS * HUECOS_POR_COLUMNA;

        var albums;
        function cargar() {
            try {
                var guardado = localStorage.getItem(CLAVE);
                if (guardado) return JSON.parse(guardado);
            } catch (e) { /* sin almacenamiento: se usan los iniciales */ }
            return INICIALES.slice();
        }
        function guardar() {
            try { localStorage.setItem(CLAVE, JSON.stringify(albums)); } catch (e) { /* ignorar */ }
        }

        // ======================= ESTANTERÍA =======================
        var estanteria = document.getElementById('estanteria');

        // Mismo reparto de acabados que tenía el Java (hashCode del título)
        function elegirEstilo(titulo) {
            var h = 0;
            for (var i = 0; i < titulo.length; i++) h = (Math.imul(h, 31) + titulo.charCodeAt(i)) | 0;
            var n = ((h % 7) + 7) % 7;
            return n <= 2 ? 'estilo-hielo' : (n <= 5 ? 'estilo-humo' : 'estilo-rojo');
        }

        function span(clase, texto) {
            var s = document.createElement('span');
            s.className = clase; s.textContent = texto;
            return s;
        }

        function crearCd(a, numero) {
            var estilo = elegirEstilo(a.titulo);
            var b = document.createElement('button');
            b.type = 'button';
            b.className = 'cd ' + estilo;
            b.dataset.estilo = estilo;
            b.dataset.num = numero;
            b.dataset.titulo = a.titulo;
            b.dataset.artista = a.artista;
            b.dataset.nota = a.puntuacion;
            b.dataset.comentario = a.comentario;
            b.setAttribute('aria-label', a.titulo + ', ' + a.artista);
            b.appendChild(span('cd-titulo', a.titulo));
            b.appendChild(span('cd-artista', a.artista));
            b.appendChild(span('cd-nota', a.puntuacion));
            return b;
        }

        function pintar() {
            estanteria.textContent = '';
            var muebles = Math.max(1, Math.ceil(albums.length / HUECOS_POR_MUEBLE));
            for (var m = 0; m < muebles; m++) {
                var mueble = document.createElement('div');
                mueble.className = 'mueble';
                for (var c = 0; c < COLUMNAS; c++) {
                    var col = document.createElement('ol');
                    col.className = 'columna';
                    for (var h = 0; h < HUECOS_POR_COLUMNA; h++) {
                        var i = m * HUECOS_POR_MUEBLE + c * HUECOS_POR_COLUMNA + h;
                        var hueco = document.createElement('li');
                        hueco.className = 'hueco';
                        if (i < albums.length) hueco.appendChild(crearCd(albums[i], i + 1));
                        col.appendChild(hueco);
                    }
                    mueble.appendChild(col);
                }
                estanteria.appendChild(mueble);
            }
            document.getElementById('total').textContent = albums.length;
        }

        // ======================= VISOR =======================
        var sinMovimiento = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var visor = document.getElementById('visor');
        var fondo = document.getElementById('visor-fondo');
        var cdFrente = document.getElementById('cd-frente');
        var ficha = document.getElementById('ficha');
        var botonCerrar = document.getElementById('cerrar');
        var abierto = null, animando = false;

        function medidas(cd) {
            var o = cd.getBoundingClientRect(), d = cdFrente.getBoundingClientRect();
            return {
                dx: (o.left + o.width / 2) - (d.left + d.width / 2),
                dy: (o.top + o.height / 2) - (d.top + d.height / 2),
                sx: o.width / d.width,
                sy: o.height / d.height
            };
        }
        function tumbado(m, giro, k) {
            k = k === undefined ? 1 : k;
            return 'translate(' + (m.dx * k) + 'px,' + (m.dy * k) + 'px) perspective(900px) rotateX(' + giro + 'deg) scale(' +
                   (m.sx + (1 - m.sx) * (1 - k)) + ',' + (m.sy + (1 - m.sy) * (1 - k)) + ')';
        }

        function abrir(cd) {
            if (abierto || animando) return;
            abierto = cd;
            var nota = parseInt(cd.dataset.nota, 10) || 0;
            document.getElementById('visor-titulo').textContent = cd.dataset.titulo;
            document.getElementById('v-artista').textContent = cd.dataset.artista;
            document.getElementById('v-nota').textContent = nota + '/10';
            document.getElementById('v-puntos').textContent = '●'.repeat(nota) + '○'.repeat(Math.max(0, 10 - nota));
            document.getElementById('v-comentario').textContent = '“' + cd.dataset.comentario + '”';
            document.getElementById('v-num').textContent = 'nº ' + cd.dataset.num;
            document.getElementById('v-pegatina-titulo').textContent = cd.dataset.titulo;
            document.getElementById('v-pegatina-artista').textContent = cd.dataset.artista;
            document.getElementById('v-pegatina-nota').textContent = nota + '/10';
            cdFrente.className = 'cd-frente ' + cd.dataset.estilo;

            visor.hidden = false;
            document.body.classList.add('visor-abierto');
            cd.classList.add('fuera');

            if (sinMovimiento) { botonCerrar.focus(); return; }
            var m = medidas(cd);
            animando = true;
            fondo.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 350, fill: 'both' });
            ficha.animate([
                { opacity: 0, transform: 'translateX(-24px)' },
                { opacity: 0, transform: 'translateX(-24px)', offset: 0.5 },
                { opacity: 1, transform: 'none' }
            ], { duration: 650, easing: 'ease-out', fill: 'both' });
            var anim = cdFrente.animate([
                { transform: tumbado(m, 82) },
                { transform: tumbado(m, 50, 0.25), offset: 0.45 },
                { transform: 'none' }
            ], { duration: 750, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'both' });
            anim.onfinish = function () { animando = false; botonCerrar.focus(); };
        }

        function cerrar() {
            if (!abierto || animando) return;
            var cd = abierto;
            function terminar() {
                cd.classList.remove('fuera');
                visor.hidden = true;
                document.body.classList.remove('visor-abierto');
                abierto = null; animando = false;
                cd.focus();
            }
            if (sinMovimiento) { terminar(); return; }
            animando = true;
            var m = medidas(cd);
            fondo.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 350, fill: 'both' });
            ficha.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 200, fill: 'both' });
            var anim = cdFrente.animate([
                { transform: 'none' },
                { transform: tumbado(m, 82) }
            ], { duration: 550, easing: 'cubic-bezier(.6,0,.8,.4)', fill: 'both' });
            anim.onfinish = terminar;
        }

        estanteria.addEventListener('click', function (e) {
            var cd = e.target.closest('.cd');
            if (cd) abrir(cd);
        });
        fondo.addEventListener('click', cerrar);
        botonCerrar.addEventListener('click', cerrar);
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape') cerrar(); });

        // ======================= AÑADIR =======================
        var formulario = document.getElementById('formulario');
        formulario.addEventListener('submit', function (e) {
            e.preventDefault();
            var f = new FormData(formulario);
            var nota = Math.max(1, Math.min(10, parseInt(f.get('puntuacion'), 10) || 1));
            var limpio = function (t) { return String(t).replace(/;/g, ',').trim(); };
            var titulo = limpio(f.get('titulo')), artista = limpio(f.get('artista'));
            if (!titulo || !artista) return;
            albums.push({ titulo: titulo, artista: artista, puntuacion: nota, comentario: limpio(f.get('comentario')) });
            guardar();
            pintar();
            formulario.reset();
            var cds = estanteria.querySelectorAll('.cd');
            var ultimo = cds[cds.length - 1];
            ultimo.classList.add('nuevo');
            ultimo.scrollIntoView({ block: 'nearest', behavior: sinMovimiento ? 'auto' : 'smooth' });
        });

        // ======================= EXPORTAR / IMPORTAR =======================
        // Mismo formato que usaba el Java: titulo;artista;nota;comentario
        document.getElementById('exportar').addEventListener('click', function () {
            var texto = albums.map(function (a) {
                return [a.titulo, a.artista, a.puntuacion, a.comentario].join(';');
            }).join('\n') + '\n';
            var enlace = document.createElement('a');
            enlace.href = URL.createObjectURL(new Blob([texto], { type: 'text/plain;charset=utf-8' }));
            enlace.download = 'albums.txt';
            document.body.appendChild(enlace);
            enlace.click();
            enlace.remove();
        });

        var archivo = document.getElementById('archivo');
        document.getElementById('importar').addEventListener('click', function () { archivo.click(); });
        archivo.addEventListener('change', function () {
            var fichero = archivo.files[0];
            if (!fichero) return;
            var lector = new FileReader();
            lector.onload = function () {
                var nuevos = [];
                lector.result.split(/\r?\n/).forEach(function (linea) {
                    var d = linea.split(';');
                    if (d.length === 4) {
                        nuevos.push({ titulo: d[0], artista: d[1], puntuacion: parseInt(d[2], 10) || 1, comentario: d[3] });
                    }
                });
                if (nuevos.length && confirm('¿Sustituir la colección actual por ' + nuevos.length + ' álbumes del archivo?')) {
                    albums = nuevos; guardar(); pintar();
                }
                archivo.value = '';
            };
            lector.readAsText(fichero, 'UTF-8');
        });

        document.getElementById('vaciar').addEventListener('click', function () {
            if (albums.length && confirm('¿Borrar los ' + albums.length + ' álbumes de la colección?')) {
                albums = []; guardar(); pintar();
            }
        });

        // ======================= ARRANQUE =======================
        albums = cargar();
        pintar();
    })();
    </script>
</body>
</html>
